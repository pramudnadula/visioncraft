[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "face-detector"
version = "2.0.0"
description = "Modular real-time face detection CLI and Python library built on OpenCV."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    "pillow>=10.4,<12",
    "fpdf2>=2.7,<3",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
]
cloud = [
    "boto3>=1.35,<2",
    "google-cloud-storage>=2.18,<3",
]
onnx = [
    "onnxruntime>=1.19",
]
# Helper packages for MediaPipe. MediaPipe itself must be installed with --no-deps because it
# hard-requires opencv-contrib-python, which conflicts with opencv-python. Use
# scripts/install_face_mesh.sh (see docs/models/face-mesh.md).
facemesh = [
    "matplotlib>=3.8",
    "absl-py>=2.1",
    "cffi>=1.16",
    "sounddevice>=0.4",
    "attrs>=23.2",
    "protobuf>=4.25",
    "flatbuffers>=24.3",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<1",
    "ruff>=0.7",
    "mypy>=1.11",
]

[project.scripts]
face-detect = "face_detector.cli:main"
facevision-api = "backend.app.main:run_server"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["face_detector*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
